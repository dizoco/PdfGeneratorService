name: CI

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  ci:
    uses: dizoco/.github/.github/workflows/ci-dotnet.yml@main
    with:
      dotnet-version: '10.0.x'

  # Valida que la imagen Docker construya (el deploy real ocurre en ci-cd.yml al mergear a main)
  docker-validate:
    name: docker-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar build de imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
